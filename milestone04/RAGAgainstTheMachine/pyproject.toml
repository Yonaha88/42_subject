[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "Retrieval-Augmented Generation over the vLLM codebase"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.162.5",
    "fire>=0.6",
    "numpy>=1.24",
    "pydantic>=2.0",
    "torch>=2.2",
    "tqdm>=4.66",
    "transformers>=5.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "flake8>=7.0",
    "httpx>=0.28.1",
    "mypy>=1.10",
    "pytest>=8.0",
]

[tool.uv]
package = false

# The campus machines have no GPU: the CPU build of torch is about 200 MB
# to download instead of several gigabytes for the CUDA build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mypy]
exclude = ["^data/", "\\.venv/"]

[[tool.mypy.overrides]]
module = ["fire", "fire.*", "tqdm", "tqdm.*", "transformers", "transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
